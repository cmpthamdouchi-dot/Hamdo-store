<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>HAMDO — الإدارة</title>
<style>
:root{--o:#F46B35;--g1:#f4f4f5;--g2:#e2e2e5;--g3:#6b6b73}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,Tahoma,Arial,sans-serif;background:var(--g1);padding:12px 12px 70px;color:#222}
.c{background:#fff;border-radius:14px;padding:14px;margin:0 auto 12px;max-width:680px}
input,textarea,select,button{font:inherit;width:100%;padding:11px;border:1px solid var(--g2);border-radius:10px;margin:4px 0 10px;background:#fff}
textarea{min-height:76px}
button{background:var(--o);color:#fff;border:0;font-weight:700;cursor:pointer;margin:0}
button.s{background:var(--g1);color:#222}button.d{background:#c0392b}button:disabled{opacity:.5}
.tabs{display:flex;gap:8px;max-width:680px;margin:0 auto 12px}.tabs button{background:#fff;color:#222}.tabs .on{background:var(--o);color:#fff}
.r{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--g1)}.r span{flex:1}.r button{width:auto;padding:8px 12px}
label{font-size:14px;color:var(--g3)}.ck{display:flex;gap:8px;align-items:center;margin-bottom:10px}.ck input{width:auto;margin:0}
small{color:var(--g3)}
#m{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;display:none;max-width:90%;z-index:9}
 .photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 14px}.photo-grid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:1px solid var(--g2)}.photo-count{font-size:13px;color:var(--g3);margin:6px 0}</style>
</head>
<body>
<div id="app"><div class="c"><h2>HAMDO — لوحة الإدارة</h2><p>جاري تحميل لوحة الإدارة...</p><p>إذا بقيت هذه الرسالة ظاهرة، فهذا يعني أن JavaScript لم يتم تحميله.</p></div></div><div id="m"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// إعدادات عامة فقط (Project URL + Publishable key). ممنوع وضع service_role أو أي سر هنا.
const HAMDO={url:"https://qkjarvcefzllkfogewqr.supabase.co",key:"sb_publishable_f27DGvJ2RVdZR7nUp_oGjA_znpHay0A"};
const U=HAMDO.url,K=HAMDO.key,$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S=null;try{S=JSON.parse(localStorage.getItem("hs"))}catch(e){}
const sv=s=>{S=s;try{s?localStorage.setItem("hs",JSON.stringify(s)):localStorage.removeItem("hs")}catch(e){}};
let tab="p",cats=[],prods=[],orders=[],ed=null,form=false;
function msg(t){const m=$("#m");m.textContent=t;m.style.display="block";clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display="none",4000)}
async function auth(path,body){const r=await fetch(U+"/auth/v1/"+path,{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||"خطأ "+r.status);return j}
async function api(path,opt={},retry=true){
  const r=await fetch(U+"/rest/v1/"+path,{...opt,headers:{apikey:K,Authorization:"Bearer "+S.access_token,"Content-Type":"application/json",...(opt.headers||{})}});
  if(r.status===401&&retry&&S.refresh_token){try{sv(await auth("token?grant_type=refresh_token",{refresh_token:S.refresh_token}))}catch(e){sv(null);draw();throw new Error("انتهت الجلسة، سجّل الدخول من جديد")}return api(path,opt,false)}
  const t=await r.text(),j=t?JSON.parse(t):null;if(!r.ok)throw new Error((j&&j.message)||"خطأ "+r.status);return j}
async function boot(){
  if(!S){draw();return}
  try{const a=await api("admins?select=user_id");if(!a.length){msg("هذا الحساب ليس مديراً");sv(null);draw();return}await load()}
  catch(e){msg(e.message);draw()}}
async function load(){[cats,prods,orders]=await Promise.all([api("categories?select=*&order=sort,id"),api("products?select=*,variants(*)&order=created_at.desc"),api("orders?select=*,order_items(*)&order=created_at.desc")]);draw()}
const stk=p=>(p.variants||[]).reduce((s,v)=>s+v.stock,0);
const loc=v=>{if(!v)return"";const d=new Date(v);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16)};
const dt=v=>v?new Date(v).toISOString():null;
function draw(){
  if(!S){$("#app").innerHTML=`<div class="c"><h2 style="margin-bottom:10px">HAMDO — دخول المدير</h2><label>البريد</label><input id="em" type="email" autocomplete="username"><label>كلمة السر</label><input id="pw" type="password" autocomplete="current-password"><button data-a="in">دخول</button></div>`;return}
  $("#app").innerHTML=`<div class="tabs"><button class="${tab==="p"?"on":""}" data-a="tab" data-v="p">المنتجات</button><button class="${tab==="c"?"on":""}" data-a="tab" data-v="c">الأقسام</button><button class="${tab==="o"?"on":""}" data-a="tab" data-v="o">الطلبات (${orders.length})</button><button class="s" data-a="out">خروج</button></div>`+(tab==="c"?catsHtml():tab==="o"?ordersHtml():form?formHtml():prodsHtml())}
const catsHtml=()=>`<div class="c"><h3>قسم جديد</h3><label>الاسم بالعربية</label><input id="ca"><label>Nom en français</label><input id="cf"><label>القسم الرئيسي (اختياري)</label><select id="cp"><option value="">قسم رئيسي</option>${cats.filter(c=>!c.parent_id).map(c=>`<option value="${c.id}">${esc(c.name_ar)} / ${esc(c.name_fr)}</option>`).join("")}</select><label>الترتيب (رقم)</label><input id="cs" type="number" value="0"><button data-a="addc">إضافة</button></div><div class="c">${cats.map(c=>`<div class="r"><span>${c.parent_id?"↳ ":""}${esc(c.name_ar)} / ${esc(c.name_fr)} ${c.active?"":"<small>(مخفي)</small>"}</span><button class="s" data-a="tc" data-id="${c.id}">${c.active?"إخفاء":"إظهار"}</button><button class="d" data-a="dc" data-id="${c.id}">حذف</button></div>`).join("")||"لا أقسام بعد"}</div>`;
const ordersHtml=()=>`<div class="c"><h3>طلبات الزبائن</h3><p style="margin:8px 0 12px;color:var(--g3)">صدّر الطلبات في ملف Excel: كل طلبية في سطر أفقي واحد.</p><button data-a="export" ${orders.some(o=>o.status==="new")?"":"disabled"}>تحميل الطلبات الجديدة Excel (${orders.filter(o=>o.status==="new").length})</button>${orders.length?orders.map(o=>`<div style="padding:12px 0;border-bottom:1px solid var(--g2)"><b>${esc(o.order_number)}</b> · ${new Date(o.created_at).toLocaleString("fr-MA")}<p style="margin:6px 0">${esc(o.customer_name)} · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a><br>${esc(o.city)} — ${esc(o.address)}</p><small>${(o.order_items||[]).map(i=>`${esc(i.product_name_ar)} · ${esc(i.color)} · ${esc(i.size)} × ${i.quantity} = ${i.line_total} DH<br><b>المصدر:</b> ${esc(i.source_name||"غير محدد")} ${i.source_url?`· <a href="${/^https?:\\/\\//i.test(i.source_url)?esc(i.source_url):"#"}" target="_blank" rel="noopener noreferrer">فتح المنتج الأصلي ↗</a>`:""}`).join("<br>")}</small><p style="margin:8px 0"><b>${o.total} DH</b> · التوصيل مجاني · الأداء عند الاستلام</p><label>حالة الطلب</label><select data-order-status="${o.id}"><option value="new" ${o.status==="new"?"selected":""}>جديد</option><option value="exported_pending" ${o.status==="exported_pending"?"selected":""}>تم التحميل - في انتظار التأكيد</option><option value="confirmed" ${o.status==="confirmed"?"selected":""}>مؤكد</option><option value="shipped" ${o.status==="shipped"?"selected":""}>تم الإرسال</option><option value="delivered" ${o.status==="delivered"?"selected":""}>تم التسليم</option><option value="cancelled" ${o.status==="cancelled"?"selected":""}>ملغى</option><option value="refused" ${o.status==="refused"?"selected":""}>رفض الاستلام</option></select><button data-a="status" data-id="${o.id}">حفظ الحالة</button></div>`).join(""):"لا توجد طلبات بعد."}</div>`;
const prodsHtml=()=>`<div class="c"><button data-a="newp">+ منتج جديد</button></div><div class="c">${prods.map(p=>`<div class="r"><span>${esc(p.name_ar)}<br><small>${p.price} MAD · المخزون ${stk(p)} ${p.active?"":"· مخفي"}</small></span><button class="s" data-a="ep" data-id="${p.id}">تعديل</button></div>`).join("")||"لا منتجات بعد"}</div>`;
function formHtml(){const p=ed||{},v=x=>esc(x??"");
  return `<div class="c"><h3>${ed?"تعديل منتج":"منتج جديد"}</h3>
<label>الاسم بالعربية *</label><input id="f_ar" value="${v(p.name_ar??(ed===null?"طقم نسائي مخطط من قطعتين":""))}"><label>Nom en français *</label><input id="f_fr" value="${v(p.name_fr??(ed===null?"Ensemble femme deux pièces à rayures":""))}">\n<label>موقع التوريد (خاص بالإدارة)</label><input id="f_source" value="${v(p.source_name)}" placeholder="مثلاً: Affilo"><label>رابط المنتج الأصلي (خاص بالإدارة)</label><input id="f_source_url" type="url" inputmode="url" value="${v(p.source_url)}" placeholder="https://...">
<label>الوصف بالعربية</label><textarea id="f_da">${v(p.desc_ar??(ed===null?"😍 الأناقة اللي كتقلبي عليها وصلاتك!\nطقم نسائي من قطعتين بتصميم مخطط وأزرار أنيقة، كيجمع بين الإطلالة المرتبة والراحة.\n✨ متوفر بألوان متعددة.\n📏 المقاس: Standard\n💰 الثمن: 280 درهم فقط\n🚚 التوصيل مجاني لجميع أنحاء المغرب\n💵 الأداء عند الاستلام، بلا تسبيق وبلا تحويل مسبق.\n❤️ اختاري اللون ديالك وطلبي دابا!":""))}</textarea><label>Description en français</label><textarea id="f_df">${v(p.desc_fr??(ed===null?"😍 L’élégance que vous recherchez est arrivée !\nUn ensemble femme deux pièces à rayures, avec veste boutonnée et pantalon assorti, pour un look soigné et confortable.\n✨ Plusieurs coloris disponibles.\n📏 Taille : Standard\n💰 Prix : 280 DH\n🚚 Livraison gratuite partout au Maroc.\n💵 Paiement à la livraison, sans avance ni virement.\n❤️ Choisissez votre couleur et commandez dès maintenant !":""))}</textarea>
<label>الثمن (درهم) *</label><input id="f_pr" type="number" step="0.01" min="0" value="${v(p.price??(ed===null?280:""))}">
<label>الثمن المخفض (اختياري)</label><input id="f_sp" type="number" step="0.01" min="0" value="${v(p.sale_price)}">
<label>بداية التخفيض</label><input id="f_ss" type="datetime-local" value="${loc(p.sale_start)}"><label>نهاية التخفيض</label><input id="f_se" type="datetime-local" value="${loc(p.sale_end)}">
<label>رفع الصور مباشرة (يمكن اختيار عدة صور مرة واحدة)</label><input id="f_files" type="file" accept="image/jpeg,image/png,image/webp" multiple><button type="button" class="s" data-a="upfiles">رفع الصور المختارة وربطها بالمنتج</button><small id="upmsg">اختَر الصور مباشرة من الهاتف أو الحاسوب، بلا ZIP.</small><hr style="border:0;border-top:1px solid var(--g2);margin:10px 0"><label>أو رفع ملف ZIP</label><input id="f_zip" type="file" accept=".zip,application/zip"><button type="button" class="s" data-a="upzip">رفع ملف ZIP</button><label>روابط الصور (https، رابط في كل سطر)</label><textarea id="f_im">${v((p.images||[]).join("\n"))}</textarea><div class="photo-count">معاينة الصور: ${(p.images||[]).length} صورة</div><div class="photo-grid">${(p.images||[]).map((u,i)=>`<img src="${v(u)}" alt="صورة المنتج ${i+1}" loading="lazy">`).join("")}</div>
<label>القسم</label><select id="f_ct"><option value="">بدون قسم</option>${cats.map(c=>`<option value="${c.id}" ${p.category_id===c.id?"selected":""}>${esc(c.name_ar)}</option>`).join("")}</select>
<label>المخزون: سطر لكل متغير بالشكل لون,مقاس,كمية</label><textarea id="f_vr">${v((p.variants||[]).map(x=>[x.color,x.size,x.stock].join(",")).join("\n")||(ed===null?["White","Teal","Black","Grey","Pink","Grouna","Brown","Argile"].map(c=>c+",Standard,60").join("\n"):""))}</textarea>
<div class="ck"><input id="f_nw" type="checkbox" ${p.is_new?"checked":""}><label>منتج جديد</label></div>
<div class="ck"><input id="f_ac" type="checkbox" ${ed?(p.active?"checked":""):""}><label>ظاهر في المتجر (خليها غير مفعّلة للمسودة)</label></div>
<button data-a="savep">حفظ</button><button class="s" style="margin-top:8px" data-a="cancel">إلغاء</button></div>`}
async function saveP(){
  const g=id=>$("#"+id).value.trim(),n=g("f_ar"),f=g("f_fr"),pr=g("f_pr");
  if(!n||!f||pr===""||+pr<0)throw new Error("أكمل الاسمين والثمن");\n  const sourceUrl=g("f_source_url");if(sourceUrl&& !/^https?:\\/\\//i.test(sourceUrl))throw new Error("رابط المصدر خاصو يبدأ بـ https:// أو http://");
  const sp=g("f_sp"),body={name_ar:n,name_fr:f,desc_ar:g("f_da"),desc_fr:g("f_df"),price:+pr,sale_price:sp===""?null:+sp,sale_start:dt(g("f_ss")),sale_end:dt(g("f_se")),
    images:g("f_im").split("\n").map(s=>s.trim()).filter(s=>/^https:\/\//.test(s)),category_id:g("f_ct")?+g("f_ct"):null,is_new:$("#f_nw").checked,active:$("#f_ac").checked};
  const vars=g("f_vr").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const a=l.split(",").map(s=>s.trim());return{color:a[0]||"",size:a[1]||"",stock:Math.max(0,parseInt(a[2])||0)}});
  let id;
  if(ed){id=ed.id;await api("products?id=eq."+id,{method:"PATCH",body:JSON.stringify(body),headers:{Prefer:"return=minimal"}});await api("variants?product_id=eq."+id,{method:"DELETE"})}
  else{id=(await api("products",{method:"POST",body:JSON.stringify(body),headers:{Prefer:"return=representation"}}))[0].id}
  if(vars.length)await api("variants",{method:"POST",body:JSON.stringify(vars.map(x=>({...x,product_id:id}))),headers:{Prefer:"return=minimal"}});
  form=false;ed=null;await load();msg("تم الحفظ")}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=+b.dataset.id;b.disabled=true;
  try{
    if(a==="in"){sv(await auth("token?grant_type=password",{email:$("#em").value.trim(),password:$("#pw").value}));await boot()}
    else if(a==="out"){sv(null);draw()}
    else if(a==="tab"){tab=b.dataset.v;form=false;ed=null;draw()}
    else if(a==="status"){const st=document.querySelector(`[data-order-status="${id}"]`).value;await api("orders?id=eq."+id,{method:"PATCH",body:JSON.stringify({status:st}),headers:{Prefer:"return=minimal"}});await load();msg("تم تحديث حالة الطلب")}
    else if(a==="export")await exportOrders()
    else if(a==="addc"){const x=$("#ca").value.trim(),y=$("#cf").value.trim();if(!x||!y)throw new Error("أدخل الاسمين");await api("categories",{method:"POST",body:JSON.stringify({name_ar:x,name_fr:y,sort:+$("#cs").value||0,parent_id:$("#cp").value?+$("#cp").value:null}),headers:{Prefer:"return=minimal"}});await load();msg("أُضيف القسم")}
    else if(a==="tc"){const c=cats.find(c=>c.id===id);await api("categories?id=eq."+id,{method:"PATCH",body:JSON.stringify({active:!c.active}),headers:{Prefer:"return=minimal"}});await load()}
    else if(a==="dc"){if(confirm("حذف هذا القسم؟ منتجاته تبقى دون قسم.")){await api("categories?id=eq."+id,{method:"DELETE"});await load()}}
    else if(a==="newp"){ed=null;form=true;draw()}
    else if(a==="ep"){ed=prods.find(p=>p.id===id);form=true;draw()}
    else if(a==="cancel"){form=false;ed=null;draw()}
    else if(a==="savep")await saveP();
    else if(a==="upzip")await uploadZip();
    else if(a==="upfiles")await uploadFiles();
  }catch(x){msg(x.message)}finally{b.disabled=false}});
boot();

async function exportOrders(){
 const pendingOrders=orders.filter(o=>o.status==="new");
 if(!pendingOrders.length)throw new Error("لا توجد طلبات جديدة غير محمّلة");
 if(!window.XLSX)throw new Error("تعذر تحميل أداة Excel. حدّث الصفحة وحاول مجدداً");
 const headers=["رقم الطلب","تاريخ الطلب","اسم الزبون","الهاتف","المدينة","العنوان","ملاحظة","المنتجات","الألوان","المقاسات","الكميات","المجموع (DH)","طريقة الأداء","حالة الطلب","موقع التوريد","رابط المنتج الأصلي"];
 const rows=pendingOrders.map(o=>{const items=o.order_items||[];return [
  o.order_number,new Date(o.created_at).toLocaleString("fr-MA"),o.customer_name,o.phone,o.city,o.address,o.note||"",
  items.map(i=>i.product_name_ar).join(" | "),items.map(i=>i.color||"").join(" | "),items.map(i=>i.size||"").join(" | "),
  items.map(i=>i.quantity).join(" | "),Number(o.total),o.payment_method==="cod"?"الدفع عند الاستلام":o.payment_method,o.status
 ]});
 const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);
 ws["!cols"]=[{wch:20},{wch:20},{wch:24},{wch:16},{wch:18},{wch:38},{wch:25},{wch:34},{wch:18},{wch:18},{wch:12},{wch:16},{wch:22},{wch:28},{wch:22},{wch:48}];
 ws["!autofilter"]={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length,c:headers.length-1}})};
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Commandes");
 XLSX.writeFile(wb,"HAMDO_Commandes_"+new Date().toISOString().slice(0,10)+".xlsx");
 const ids=pendingOrders.map(o=>o.id);
 if(ids.length){
  await api("orders?id=in.("+ids.join(",")+")",{method:"PATCH",body:JSON.stringify({status:"exported_pending"}),headers:{Prefer:"return=minimal"}});
 }
 await load();msg("تم تحميل ملف Excel وتحديث حالة الطلبات إلى: في انتظار التأكيد");
}
async function uploadFiles(){
 const files=[...($("#f_files").files||[])];
 if(!files.length) throw new Error("اختَر صورة واحدة على الأقل");
 if(!ed) throw new Error("احفظ المنتج أولاً ثم افتحه للتعديل قبل رفع الصور");
 const allowed=["image/jpeg","image/png","image/webp"];
 if(files.some(f=>!allowed.includes(f.type))) throw new Error("الصيغ المدعومة هي JPG وPNG وWEBP فقط");
 const urls=($("#f_im").value||"").split("\n").map(x=>x.trim()).filter(x=>/^https:\/\//.test(x));
 $("#upmsg").textContent="جارٍ رفع الصور...";
 for(let i=0;i<files.length;i++){
   const file=files[i],ext=file.type==="image/png"?"png":file.type==="image/webp"?"webp":"jpg";
   const path=ed.id+"/"+Date.now()+"_"+String(i+1).padStart(2,"0")+"."+ext;
   const res=await fetch(U+"/storage/v1/object/product-images/"+path,{method:"POST",headers:{apikey:K,Authorization:"Bearer "+S.access_token,"Content-Type":file.type,"x-upsert":"false"},body:file});
   if(!res.ok){const t=await res.text();throw new Error("فشل رفع الصورة "+(i+1)+": "+t)}
   urls.push(U+"/storage/v1/object/public/product-images/"+path);
   $("#upmsg").textContent="تم رفع "+(i+1)+" من "+files.length;
 }
 await api("products?id=eq."+ed.id,{method:"PATCH",body:JSON.stringify({images:urls}),headers:{Prefer:"return=minimal"}});
 $("#f_im").value=urls.join("\n");
 $("#upmsg").textContent="تم رفع وربط "+files.length+" صورة جديدة. المجموع: "+urls.length;
 msg("تم رفع الصور وربطها بالمنتج");
 await load(); const savedId=ed.id; ed=prods.find(p=>p.id===savedId); form=true; draw();
}
async function uploadZip(){
 const file=$("#f_zip").files[0]; if(!file) throw new Error("اختَر ملف ZIP أولاً");
 if(!ed) throw new Error("احفظ المنتج أولاً ثم افتحه للتعديل قبل رفع الصور");
 if(!window.JSZip) throw new Error("تعذر تحميل أداة قراءة ZIP. أعد تحميل الصفحة وحاول مجدداً");
 $("#upmsg").textContent="جارٍ تجهيز الصور...";
 const zip=await JSZip.loadAsync(file), names=Object.keys(zip.files).filter(n=>!zip.files[n].dir && /\.(jpe?g|png|webp)$/i.test(n)).sort();
 if(!names.length) throw new Error("لم أجد صوراً داخل ملف ZIP");
 const urls=[];
 for(let i=0;i<names.length;i++){
   const entry=zip.files[names[i]], blob=await entry.async("blob");
   const ext=(names[i].split(".").pop()||"jpg").toLowerCase(), mime=ext==="png"?"image/png":ext==="webp"?"image/webp":"image/jpeg";
   const path=ed.id+"/"+String(i+1).padStart(2,"0")+"."+ext;
   const res=await fetch(U+"/storage/v1/object/product-images/"+path,{method:"POST",headers:{apikey:K,Authorization:"Bearer "+S.access_token,"Content-Type":mime,"x-upsert":"true"},body:blob});
   if(!res.ok){const t=await res.text();throw new Error("فشل رفع الصورة "+(i+1)+": "+t)}
   urls.push(U+"/storage/v1/object/public/product-images/"+path);
   $("#upmsg").textContent="تم رفع "+(i+1)+" من "+names.length;
 }
 await api("products?id=eq."+ed.id,{method:"PATCH",body:JSON.stringify({images:urls}),headers:{Prefer:"return=minimal"}});
 $("#f_im").value=urls.join("\n");
 $("#upmsg").textContent="تم رفع وربط "+urls.length+" صورة بنجاح";
 msg("تم رفع الصور وربطها بالمنتج");
 await load(); ed=prods.find(p=>p.id===ed.id); form=true; draw();
}
document.addEventListener("change",e=>{if(e.target.id==="f_zip"){const m=$("#upmsg");if(m)m.textContent=e.target.files[0]?.name||"اختَر ملف ZIP";}});

</script>
</body>
