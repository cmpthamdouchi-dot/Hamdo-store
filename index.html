<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAMDO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.svg">
<meta name="theme-color" content="#F46B35">
<style>
:root{--o:#E97845;--od:#B95D36;--iv:#FAF7F1;--be:#F1E7D8;--g1:#F5F1EA;--g2:#E8DED1;--g3:#81776D;--tx:#302A25}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--tx);background:var(--iv);padding-bottom:40px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
header{position:sticky;top:0;z-index:5;background:rgba(250,247,241,.97);border-bottom:1px solid var(--g2);padding:10px 14px;backdrop-filter:blur(12px)}
.top{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:27px;letter-spacing:1px;flex:1;color:#F46B35;font-family:Arial,sans-serif}
.logo img{width:54px;height:54px;object-fit:contain;display:block}
.ib{min-width:44px;height:44px;border-radius:15px;background:#fff;border:1px solid var(--g2);font-weight:700;position:relative}
.bd{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--o);color:#fff;font-size:11px;border-radius:10px;padding:1px 6px}
.sb{width:100%;margin-top:10px;height:48px;border-radius:16px;border:1px solid var(--g2);padding:0 16px;font:inherit;background:#fff;box-shadow:0 3px 12px rgba(74,53,34,.035)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px}
.chip{white-space:nowrap;padding:10px 18px;border-radius:22px;background:#fff;border:1px solid var(--g2);font-weight:650;color:#55483D}
.chip.on{background:var(--o);border-color:var(--o);color:#fff;box-shadow:0 4px 12px rgba(233,120,69,.2)}
h2{font-size:20px;margin:22px 14px 12px;font-weight:800;color:#382F28}
.hero{margin:12px 14px 22px;padding:0;border-radius:24px;background:#F3E4D5;color:var(--tx);min-height:0;display:block;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(111,72,43,.09);border:1px solid #E9D3BF}.hero img{display:block;width:100%;height:auto;object-fit:contain}.hero:after,.hero:before{display:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 13px;padding:0 14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.deal-strip{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:0 14px 12px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.deal-strip .card{flex:0 0 44%;min-width:0;scroll-snap-align:start}
@media(min-width:700px){.deal-strip .card{flex-basis:220px}}
.card{cursor:pointer}
.im{position:relative;aspect-ratio: .82;border-radius:19px;background:var(--be)!important;display:flex;align-items:center;justify-content:center;font-size:64px;overflow:hidden}
.tag{position:absolute;top:10px;inset-inline-start:10px;background:var(--o);color:#fff;font-size:12px;font-weight:750;padding:5px 9px;border-radius:10px}
.tag.out{background:var(--g3)}
.fv{position:absolute;top:9px;inset-inline-end:9px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.94);color:#C9BFB4;font-size:18px;box-shadow:0 2px 8px rgba(50,35,20,.08)}
.fv.on{color:var(--o)}
.nm{margin-top:10px;font-weight:650;font-size:15px;line-height:1.55;color:#3A312A}
.pr{margin-top:4px}.pr b{color:var(--od);font-weight:800}.pr s{color:#A59A8E;font-size:13px}
.im img,.em img{width:100%;height:100%;object-fit:cover;border-radius:inherit}.sh > .im img{object-fit:contain;background:#fff}
.product-stage{display:grid;grid-template-columns:minmax(0,3.4fr) minmax(76px,.85fr);gap:8px;align-items:start;direction:ltr;margin:0 0 12px;height:auto;min-height:0;max-height:none;overflow:hidden}.product-main{grid-column:1;grid-row:1;min-height:0;height:auto;max-height:none;align-self:start}.gallery-rail{grid-column:2;grid-row:1;height:auto;max-height:74vh;min-height:0;overflow-y:auto;box-sizing:border-box}.product-main{width:100%;min-width:0;min-height:0;border-radius:14px;overflow:hidden;display:flex;align-items:flex-start;justify-content:center}.product-main img{display:block;width:100%;height:auto;max-height:74vh;object-fit:contain;background:#fff}.gallery-rail{height:auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;display:flex;flex-direction:column;gap:8px;align-items:stretch;padding:2px 0}.gallery-rail button{width:100%;height:96px;min-height:96px;flex:0 0 96px;border:2px solid var(--g2);border-radius:9px;overflow:hidden;padding:0;background:#fff}.gallery-rail button.on{border-color:var(--o)}.gallery-rail img{width:100%;height:100%;object-fit:cover}.desc{margin:8px 0;color:var(--g3);white-space:pre-line;line-height:1.7}
.section-sep{height:1px;background:linear-gradient(90deg,transparent,var(--o),transparent);border:0;margin:24px 14px;opacity:.65}.note{margin:0 14px;padding:14px;border-radius:12px;background:var(--g1);color:var(--g3);font-size:14px;line-height:1.6}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end}
.ov.show{display:flex}
.sh{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;max-width:640px;margin:auto auto 0}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.op{min-width:44px;height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--g2);font-weight:600}
.op.on{border-color:var(--o);color:var(--od)}
.cta{width:100%;height:50px;border-radius:14px;background:var(--o);color:#fff;font-weight:700;font-size:16px}
.cta:disabled{background:var(--g2);color:var(--g3)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--g1)}
.row .em{width:56px;height:56px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:30px}
.q{display:flex;align-items:center;gap:8px}.qtybox{display:flex;align-items:center;gap:10px;margin:12px 0}.qtybox button{background:var(--g1);border-radius:9px;width:36px;height:36px;font-weight:700}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions .secondary{background:#222}
#checkoutForm{margin-top:14px;text-align:right}#checkoutForm label{display:block;font-weight:600;font-size:15px;margin:12px 0 5px}#checkoutForm input,#checkoutForm textarea{display:block;width:100%;max-width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--g2);border-radius:12px;background:#fff;color:var(--tx);font:inherit;font-size:16px;direction:rtl;text-align:right;margin:0 0 12px;outline:none}#checkoutForm textarea{min-height:92px;resize:vertical}#checkoutForm input:focus,#checkoutForm textarea:focus{border-color:var(--o);box-shadow:0 0 0 2px rgba(244,107,53,.12)}.q button{width:36px;height:36px;border-radius:10px;background:var(--g1);font-weight:700}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:12px;z-index:30;display:none}

/* HAMDO phase 2: richer storefront composition */
#chips{padding:10px 14px 14px;gap:9px}
.home-categories{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:0 14px;margin:14px 0 18px}
.home-cat{background:linear-gradient(145deg,#fff 0%,#F3E7D9 100%);border:1px solid #EADCCB;border-radius:17px;min-height:76px;padding:13px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#49382C;font-weight:750;box-shadow:0 4px 12px rgba(82,54,31,.045)}
.home-cat span:first-child{font-size:25px;line-height:1}
.service-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:0 14px 20px;padding:13px 4px;background:#F3E8DC;border:1px solid #EDE0D2;border-radius:18px}
.service-item{text-align:center;padding:0 5px;font-size:12px;font-weight:750;color:#49382C;line-height:1.5}
.service-item+ .service-item{border-right:1px solid #D8B99F}
.service-item b{display:block;color:var(--od);font-size:21px;line-height:1.2;margin-bottom:3px}
.hero{min-height:0}.hero img{width:100%;height:auto;display:block}
.home-products-head{display:flex;align-items:center;justify-content:space-between;margin:22px 14px 12px}
.home-products-head h2{margin:0}
.home-products-head button{border:1px solid var(--o);color:var(--od);border-radius:22px;padding:7px 13px;font-weight:700;background:#fff}
@media(min-width:700px){.home-categories{grid-template-columns:repeat(6,minmax(0,1fr))}.service-strip{max-width:900px;margin-inline:auto}.hero{min-height:220px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo" aria-label="HAMDO"><img src="HAMDO_logo_transparent.png" alt="HAMDO"></div>
    <button class="ib" data-act="lang" id="lb"></button>
    <button class="ib" data-act="favs" aria-label="favorites">♥<span class="bd" id="fc"></span></button>
    <button class="ib" data-act="cart" aria-label="cart">🛒<span class="bd" id="cc"></span></button>
  </div>
  <input class="sb" id="q" list="dl" autocomplete="off"><datalist id="dl"></datalist>
</header>
<div class="chips" id="chips"></div>
<main id="main"></main>
<div class="ov" id="ov"><div class="sh" id="sh"></div></div>
<div id="toast"></div>
<script src="config.js"></script>
<script>
let CATS=[];
const COL={black:["#222","أسود","Noir"],white:["#eee","أبيض","Blanc"],orange:["#F46B35","برتقالي","Orange"],gray:["#888","رمادي","Gris"],blue:["#2f6fd0","أزرق","Bleu"],teal:["#168b83","أزرق مخضر","Bleu canard"],grey:["#888","رمادي","Gris"],pink:["#e98ba8","وردي","Rose"],brown:["#795548","بني","Marron"],argile:["#b58a70","طيني","Argile"],grouna:["#800020","خمري","Bordeaux"]};
let P=[],bestProducts=[],st="ld",parentCat="all";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cn=c=>{const key=String(c||"").trim().toLowerCase();return COL[key]?COL[key][lang==="ar"?1:2]:(c||"");};
const pic=p=>p.img?`<img src="${p.img}" alt="">`:p.emoji;
const X={ar:{ld:"جارٍ تحميل المنتجات…",es:"المتجر قيد التجهيز، سنضيف المنتجات قريباً.",er:"تعذّر تحميل المنتجات. تحقق من الاتصال وأعد المحاولة."},fr:{ld:"Chargement des produits…",es:"La boutique est en préparation, les produits arrivent bientôt.",er:"Impossible de charger les produits. Vérifiez la connexion et réessayez."}};
const T={
ar:{s:"ابحث عن منتج…",all:"الكل",new:"جديدنا",deals:"العروض",best:"الأكثر مبيعاً",bestn:"منتجات مختارة لك.",more:"منتجات أخرى",hero:"مرحباً بك في HAMDO",herot:"توصيل مجاني والدفع عند الاستلام",out:"غير متوفر",add:"أضف إلى السلة",added:"أُضيف إلى السلة",cart:"سلة التسوق",empty:"لا توجد منتجات هنا بعد.",total:"المجموع",ship:"التوصيل مجاني",co:"إتمام الطلب",con:"أدخل معلوماتك لتأكيد الطلب. الدفع عند الاستلام والتوصيل مجاني.",separate:"تنبيه: إذا طلبت أكثر من منتج، فسيتم تسجيل كل منتج في طلبية مستقلة، وسيكون له رقم طلب خاص به.",buy:"اشترِ الآن",name:"الاسم الكامل",phone:"رقم الهاتف",city:"المدينة",address:"العنوان بالتفصيل",note:"ملاحظة (اختياري)",confirm:"تأكيد الطلب",cod:"الدفع عند الاستلام",success:"تم تسجيل طلبك بنجاح!",orderNo:"رقم الطلب",required:"يرجى ملء جميع المعلومات المطلوبة.",color:"اللون",size:"المقاس",stock:"متوفر",low:"كمية محدودة",favs:"المفضلة",none:"لا شيء بعد",close:"إغلاق",pick:"اختر اللون والمقاس",none2:"لا نتائج مطابقة.",lg:"FR",cur:"د.م"},
fr:{s:"Rechercher un produit…",all:"Tout",new:"Nouveautés",deals:"Promotions",best:"Meilleures ventes",bestn:"Une sélection de produits pour vous.",more:"Autres produits",hero:"Bienvenue chez HAMDO",herot:"Livraison gratuite, paiement à la livraison",out:"Indisponible",add:"Ajouter au panier",added:"Ajouté au panier",cart:"Panier",empty:"Aucun produit pour le moment.",total:"Total",ship:"Livraison gratuite",co:"Commander",con:"Renseignez vos coordonnées pour confirmer. Paiement à la livraison, livraison gratuite.",separate:"À noter : si vous commandez plusieurs produits, chaque produit sera enregistré dans une commande séparée avec son propre numéro.",buy:"Acheter maintenant",name:"Nom complet",phone:"Téléphone",city:"Ville",address:"Adresse détaillée",note:"Note (facultatif)",confirm:"Confirmer la commande",cod:"Paiement à la livraison",success:"Votre commande est enregistrée !",orderNo:"Numéro de commande",required:"Veuillez remplir les champs obligatoires.",color:"Couleur",size:"Taille",stock:"En stock",low:"Quantité limitée",favs:"Favoris",none:"Rien pour le moment",close:"Fermer",pick:"Choisissez la couleur et la taille",none2:"Aucun résultat.",lg:"عربي",cur:"MAD"}};
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let lang=ld("lang","ar"),cart=ld("cart",[]),favs=ld("favs",[]),cat="all",view="home",sel={};
const t=k=>T[lang][k],m=n=>lang==="ar"?n+" "+t("cur"):n+" "+t("cur");
const $=s=>document.querySelector(s),pp=id=>P.find(p=>p.id===id),eff=p=>p.sale||p.price;
const bg=p=>p.id%2?"#fdeee6":"#f1f1f3";
function card(p){return `<div class="card" data-act="open" data-id="${p.id}"><div class="im" style="background:${bg(p)}">${pic(p)}${p.stock<=0?`<span class="tag out">${t("out")}</span>`:p.sale?`<span class="tag">-${Math.round(100-p.sale/p.price*100)}%</span>`:""}<button class="fv ${favs.includes(p.id)?"on":""}" data-act="fav" data-id="${p.id}" aria-label="fav">♥</button></div><div class="nm">${p[lang]}</div><div class="pr">${p.sale?`<b>${m(p.sale)}</b> <s>${m(p.price)}</s>`:`<b>${m(p.price)}</b>`}</div></div>`}
const grid=a=>a.length?`<div class="grid">${a.map(card).join("")}</div>`:`<p class="note">${t("empty")}</p>`;
const hscroll=a=>a.length?`<div class="deal-strip">${a.map(card).join("")}</div>`:`<p class="note">${t("empty")}</p>`;
function render(){
  const d=document.documentElement;d.lang=lang;d.dir=lang==="ar"?"rtl":"ltr";
  $("#lb").textContent=t("lg");$("#q").placeholder=t("s");
  $("#dl").innerHTML=P.map(p=>`<option value="${p[lang]}">`).join("");
  const roots=CATS.filter(x=>!x.parent_id);
  const children=CATS.filter(x=>x.parent_id===cat);
  const shown=cat==="all"?roots:children;
  $("#chips").innerHTML=[{id:"all",ar:T.ar.all,fr:T.fr.all},...shown].map(x=>`<button class="chip ${cat===x.id?"on":""}" data-act="cat" data-v="${x.id}">${x[lang]}</button>`).join("");
  $("#fc").textContent=favs.length||"";$("#cc").textContent=cart.reduce((s,x)=>s+x.q,0)||"";
  const q=$("#q").value.trim().toLowerCase();
  const childIds=children.map(x=>x.id);
  let list=P.filter(p=>cat==="all"||(childIds.length?childIds.includes(p.cat):p.cat===cat));
  if(view==="favs")list=P.filter(p=>favs.includes(p.id));
  if(q)list=list.filter(p=>(p.ar+p.fr+p.da+p.df).toLowerCase().includes(q));
  let h="";
  if(view==="favs")h=`<h2>${t("favs")}</h2>`+grid(list)+`<p class="note" style="margin-top:12px"><button data-act="home">← ${t("all")}</button></p>`;
  else if(q||cat!=="all")h=(cat!=="all"?`<h2>${CATS.find(x=>x.id===cat)?.[lang]||""}</h2>`:"")+(childIds.length?`<div class="chips">${children.map(x=>`<button class="chip" data-act="cat" data-v="${x.id}">${x[lang]}</button>`).join("")}</div>`:"")+(list.length?grid(list):`<p class="note" style="margin-top:14px">${t("none2")}</p>`);
  else {const roots=CATS.filter(x=>!x.parent_id);const icons=["👘","🖤","👗","🧥","👜","💍","👠","🕶️","🧣"];h=`<div class="hero"><img src="file_00000000a2a081f48f2b97d55e8be473.png" alt="HAMDO - أزياء عصرية للنساء"></div>`+`<div class="service-strip"><div class="service-item"><b>🚚</b>${lang==="ar"?"توصيل مجاني":"Livraison gratuite"}</div><div class="service-item"><b>🛡️</b>${lang==="ar"?"الدفع عند الاستلام":"Paiement à la livraison"}</div><div class="service-item"><b>🎧</b>${lang==="ar"?"خدمة الزبناء":"Service client"}</div></div>`+`<div class="home-products-head"><h2>${t("new")}</h2><button data-act="cat" data-v="all">${lang==="ar"?"عرض المزيد":"Voir plus"}</button></div>`+grid(P.filter(p=>p.isNew))+`<hr class="section-sep"><h2>${t("deals")}</h2>`+hscroll(P.filter(p=>p.sale))+`<hr class="section-sep"><h2>${t("more")}</h2>`+grid(P); }
  $("#main").innerHTML=st==="ok"&&P.length?h:`<p class="note" style="margin:14px">${X[lang][st==="ok"?"es":st]}</p>`;
}
function sheet(h){$("#sh").innerHTML=h;$("#ov").classList.add("show")}
const closeSheet=()=>$("#ov").classList.remove("show");
function toast(s){const e=$("#toast");e.textContent=s;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",1800)}
function openP(id){const p=pp(id);sel={id,c:p.colors[0]||"",s:p.sizes[0]||"",q:1};drawP()}
function drawP(){const p=pp(sel.id),out=p.stock<=0,images=p.images||[],activeImage=images[sel.img||0]||p.img;
  sheet(`<div class="product-stage"><div class="product-main" style="background:${bg(p)}">${activeImage?`<img src="${activeImage}" alt="${p[lang]}">`:p.emoji}</div><div class="gallery-rail">${images.map((u,i)=>({u,i})).map(x=>`<button class="${(sel.img||0)===x.i?"on":""}" data-act="pi" data-v="${x.i}"><img src="${x.u}" alt=""></button>`).join("")}</div></div><h2 style="margin:12px 0 4px">${p[lang]}</h2><div class="pr" style="font-size:18px">${p.sale?`<b>${m(p.sale)}</b> <s>${m(p.price)}</s>`:`<b>${m(p.price)}</b>`}</div><p class="desc">${lang==="ar"?p.da:p.df}</p><p><b>${out?t("out"):p.stock<=5?t("low"):t("stock")}</b></p>
  ${p.colors.length?`<p style="margin-top:10px">${t("color")}</p>`:""}<div class="opts">${p.colors.map(c=>`<button class="op ${sel.c===c?"on":""}" data-act="pc" data-v="${c}">${cn(c)}</button>`).join("")}</div>
  ${p.sizes.length?`<p>${t("size")}</p><div class="opts">${p.sizes.map(s=>`<button class="op ${sel.s===s?"on":""}" data-act="ps" data-v="${s}">${s}</button>`).join("")}</div>`:""}
  <div class="qtybox"><span>${t("size")}</span><button data-act="qtyminus">−</button><b id="buyqty">${sel.q||1}</b><button data-act="qtyplus">+</button></div><div class="actions"><button class="cta" data-act="add" ${out?"disabled":""}>${out?t("out"):t("add")}</button><button class="cta secondary" data-act="buy" ${out?"disabled":""}>${t("buy")}</button></div><button class="cta" style="background:var(--g1);color:var(--tx);margin-top:8px" data-act="close">${t("close")}</button>`);
  requestAnimationFrame(()=>{const stage=document.querySelector(".product-stage"),main=document.querySelector(".product-main"),img=main?.querySelector("img"),rail=document.querySelector(".gallery-rail");if(!stage||!main||!rail)return;const fitRail=()=>{const h=img?img.getBoundingClientRect().height:main.getBoundingClientRect().height;rail.style.height=Math.max(0,h)+"px";rail.style.maxHeight="74vh";};if(img&&!img.complete)img.addEventListener("load",fitRail,{once:true});fitRail();const chosen=document.querySelector(`.gallery-rail button[data-v="${sel.img||0}"]`);if(chosen){const top=chosen.offsetTop-rail.offsetTop-(rail.clientHeight-chosen.offsetHeight)/2;rail.scrollTo({top:Math.max(0,top),behavior:"smooth"});}});
}
function checkoutItems(items,clearCart){const rows=items.map(i=>{const p=pp(i.id);return {product_id:i.id,color:i.c||"",size:i.s||"",quantity:i.q}});const total=items.reduce((s,i)=>s+eff(pp(i.id))*i.q,0);sheet(`<h2 style="margin:0 0 10px">${t("co")}</h2><p class="note">${t("con")}<br><b>${t("cod")}</b> · ${t("ship")}</p><p class="note" style="margin-top:8px">${t("separate")}</p><form id="checkoutForm" style="margin-top:12px"><label>${t("name")} *</label><input name="customer_name" required minlength="2" autocomplete="name"><label>${t("phone")} *</label><input name="phone" required type="tel" inputmode="tel" autocomplete="tel"><label>${t("city")} *</label><input name="city" required><label>${t("address")} *</label><textarea name="address" required minlength="5" rows="3" style="width:100%;border:1px solid var(--g2);border-radius:10px;padding:10px;font:inherit"></textarea><label>${t("note")}</label><textarea name="note" rows="2" style="width:100%;border:1px solid var(--g2);border-radius:10px;padding:10px;font:inherit"></textarea><p style="margin:12px 0"><b>${t("total")}: ${m(total)}</b><br><small>${t("ship")} · ${t("cod")}</small></p><button class="cta" id="submitOrder" type="submit">${t("confirm")}</button></form><button class="cta" style="background:var(--g1);color:var(--tx);margin-top:8px" data-act="close">${t("close")}</button>`);$("#checkoutForm").addEventListener("submit",async e=>{e.preventDefault();const btn=$("#submitOrder");btn.disabled=true;btn.textContent=t("ld");try{const fd=new FormData(e.currentTarget),payload={p_customer_name:fd.get("customer_name"),p_phone:fd.get("phone"),p_city:fd.get("city"),p_address:fd.get("address"),p_note:fd.get("note"),p_items:rows};const r=await fetch(HAMDO.url+"/rest/v1/rpc/create_customer_order",{method:"POST",headers:{apikey:HAMDO.key,"Content-Type":"application/json"},body:JSON.stringify(payload)});const result=await r.json();if(!r.ok)throw new Error(result.message||result.details||result.hint||"تعذر تسجيل الطلب");if(clearCart){cart=[];sv("cart",cart);render()}const orderRows=(result.orders||[{order_number:result.order_number,total:result.total,product_name:""}]).map(o=>`<div style="padding:8px 0;border-bottom:1px solid var(--g2)"><b>${esc(o.product_name||"")}</b><br>${t("orderNo")}: <b>${esc(o.order_number)}</b><br>${t("total")}: ${m(o.total)}</div>`).join("");sheet(`<h2>${t("success")}</h2><p class="note">${orderRows}<b>${t("total")}: ${m(result.total)}</b></p><button class="cta" data-act="close" style="margin-top:12px">${t("close")}</button>`)}catch(err){btn.disabled=false;btn.textContent=t("confirm");toast(err.message)}})}
function drawCart(){const rows=cart.map((i,x)=>{const p=pp(i.id);return `<div class="row"><div class="em" style="background:${bg(p)}">${pic(p)}</div><div style="flex:1"><b>${p[lang]}</b><br><small>${cn(i.c)} ${i.s}</small><br>${m(eff(p))}</div><div class="q"><button data-act="dec" data-x="${x}">−</button>${i.q}<button data-act="inc" data-x="${x}">+</button></div></div>`}).join("");
  const tot=cart.reduce((s,i)=>s+eff(pp(i.id))*i.q,0);
  sheet(`<h2 style="margin:0 0 6px">${t("cart")}</h2>${rows||`<p class="note">${t("none")}</p>`}<p style="margin:12px 0"><b>${t("total")}: ${m(tot)}</b><br><small>${t("ship")}</small></p><button class="cta" data-act="checkout" ${cart.length?"":"disabled"}>${t("co")}</button><p class="note" style="margin:8px 0">${t("con")}</p><button class="cta" style="background:var(--g1);color:var(--tx)" data-act="close">${t("close")}</button>`)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b){if(e.target.id==="ov")closeSheet();return}
  const a=b.dataset.act,id=+b.dataset.id,x=+b.dataset.x;
  if(a==="lang"){lang=lang==="ar"?"fr":"ar";sv("lang",lang);render()}
  else if(a==="cat"){const v=b.dataset.v==="all"?"all":+b.dataset.v; if(v!=="all"&&CATS.some(c=>c.id===v&&!c.parent_id)){parentCat=v;cat=v}else if(v==="all"){parentCat="all";cat="all"}else{cat=v;parentCat=CATS.find(c=>c.id===v)?.parent_id||"all"}view="home";render()}
  else if(a==="home"){view="home";render()}
  else if(a==="favs"){view="favs";render()}
  else if(a==="fav"){favs=favs.includes(id)?favs.filter(f=>f!==id):[...favs,id];sv("favs",favs);render()}
  else if(a==="open")openP(id);
  else if(a==="pi"){sel.img=+b.dataset.v;drawP()}
  else if(a==="pc"){sel.c=b.dataset.v;drawP()}
  else if(a==="ps"){sel.s=b.dataset.v;drawP()}
  else if(a==="add"){const f=cart.find(i=>i.id===sel.id&&i.c===sel.c&&i.s===sel.s);f?f.q+=sel.q||1:cart.push({id:sel.id,c:sel.c,s:sel.s,q:sel.q||1});sv("cart",cart);closeSheet();render();toast(t("added"))}
  else if(a==="buy"){checkoutItems([{id:sel.id,c:sel.c,s:sel.s,q:sel.q||1}],false)}
  else if(a==="checkout"){checkoutItems(cart,true)}
  else if(a==="qtyplus"){sel.q=Math.min(99,(sel.q||1)+1);$("#buyqty").textContent=sel.q}
  else if(a==="qtyminus"){sel.q=Math.max(1,(sel.q||1)-1);$("#buyqty").textContent=sel.q}
  else if(a==="cart")drawCart();
  else if(a==="inc"){cart[x].q++;sv("cart",cart);drawCart();render()}
  else if(a==="dec"){cart[x].q--;if(cart[x].q<=0)cart.splice(x,1);sv("cart",cart);drawCart();render()}
  else if(a==="close")closeSheet();
});
async function load(){
  render();
  try{
    const H={headers:{apikey:HAMDO.key}},B=HAMDO.url+"/rest/v1/";
    const [c,p,sales]=await Promise.all([fetch(B+"categories?select=*&active=eq.true&order=sort,id",H),fetch(B+"products?select=*,variants(*)&active=eq.true&order=created_at.desc",H),fetch(B+"order_items?select=product_id,quantity,orders!inner(status)&orders.status=eq.delivered",H).catch(()=>null)]);
    if(!c.ok||!p.ok)throw 0;
    CATS=(await c.json()).map(x=>({id:x.id,parent_id:x.parent_id,ar:esc(x.name_ar),fr:esc(x.name_fr)}));
    const now=Date.now();
    P=(await p.json()).map(x=>{const v=x.variants||[];
      const sale=x.sale_price!=null&&(!x.sale_start||Date.parse(x.sale_start)<=now)&&(!x.sale_end||Date.parse(x.sale_end)>=now)?+x.sale_price:0;
      const images=(x.images||[]).filter(u=>/^https:\/\//.test(u)).map(esc),im=images[0]||"";
      return{id:x.id,cat:x.category_id,ar:esc(x.name_ar),fr:esc(x.name_fr),da:esc(x.desc_ar).replace(/\\n/g,"\n"),df:esc(x.desc_fr).replace(/\\n/g,"\n"),price:+x.price,sale:sale||undefined,img:im,images,emoji:"🛍️",
        colors:[...new Set(v.map(y=>y.color).filter(Boolean))].map(esc),sizes:[...new Set(v.map(y=>y.size).filter(Boolean))].map(esc),
        stock:v.reduce((s,y)=>s+Math.max(0,y.stock-y.reserved),0),isNew:x.is_new}});
    const available=P.filter(x=>x.stock>0);
    const salesCount={};
    if(sales?.ok){const sold=await sales.json();sold.forEach(i=>{salesCount[i.product_id]=(salesCount[i.product_id]||0)+Math.max(0,+i.quantity||0)})}
    const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
    const ranked=available.filter(x=>(salesCount[x.id]||0)>0).sort((a,b)=>(salesCount[b.id]||0)-(salesCount[a.id]||0));
    const rest=shuffle(available.filter(x=>!ranked.some(y=>y.id===x.id)));
    bestProducts=[...ranked.slice(0,3),...rest.slice(0,Math.max(0,3-Math.min(3,ranked.length)))];
    if(!ranked.length)bestProducts=shuffle(available).slice(0,3);
    cart=cart.filter(i=>pp(i.id));sv("cart",cart);st="ok";
  }catch(e){st="er"}
  render();
}
$("#q").addEventListener("input",()=>{view="home";render()});
load();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
